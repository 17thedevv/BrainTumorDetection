experiment_name: "ssl_pseudo_label"
project_name: "brain_tumor_detection"
seed: 42

data:
  dataset1_train_path: "./data/dataset1/Training"
  dataset1_test_path: "./data/dataset1/Testing"
  dataset2_path: "./data/dataset2"
  num_workers: 0

model:
  name: "improved_cnn"      # ResNet-18 style, from scratch
  num_classes: 4
  pretrained: false

training:
  learning_rate: 0.0001
  weight_decay: 0.0001
  ssl_enabled: true

ssl:
  labeled_per_class: 450        # 450 × 4 class = 1800 ảnh có nhãn (tăng 80% nhãn gốc để Phase A mạnh hơn)
  warmup_epochs: 15             # Phase A: supervised warmup
  ssl_epochs: 20                # Phase B: pseudo-labeling
  pseudo_threshold_start: 0.90  # Ngưỡng confidence ban đầu (siết chặt từ 0.85 lên 0.90)
  pseudo_threshold_end: 0.97    # Ngưỡng confidence cuối (siết chặt từ 0.95 lên 0.97)
  pseudo_loss_weight: 0.5       # λ: trọng số loss pseudo-labeled
  min_pseudo_per_class: 15      # Tối thiểu mỗi class để coi là hợp lệ

development:
  enabled: false       # Bật để test nhanh
  subset_ratio: 1.0
  image_size: 128
  batch_size: 16
  epochs: 35          # warmup(15) + ssl(20) = 35 total
  early_stopping_patience: 7

research:
  enabled: true      # Tắt development để dùng research
  subset_ratio: 1.0
  image_size: 224
  batch_size: 32
  epochs: 35
  early_stopping_patience: 10
