experiment_name: "baseline_supervised"
project_name: "brain_tumor_detection"
seed: 42

data:
  dataset1_train_path: "./data/dataset1/Training"
  dataset1_test_path: "./data/dataset1/Testing"
  dataset2_path: "./data/dataset2"  # Will be used later in SSL phase
  num_workers: 2

model:
  name: "custom_cnn"
  num_classes: 4
  pretrained: false

training:
  learning_rate: 0.0001
  weight_decay: 0.0001
  ssl_enabled: false

development:
  enabled: false
  subset_ratio: 0.7
  image_size: 128
  batch_size: 8
  epochs: 10

research:
  enabled: true
  subset_ratio: 1.0
  image_size: 224
  batch_size: 32
  epochs: 30
